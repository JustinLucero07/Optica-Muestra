server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;                 # no mostrar versión de nginx

    # Cabeceras de seguridad (se repiten en cada location porque add_header no se hereda)
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

    # Proxy del API al backend
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        # Se SOBRESCRIBEN (no se agregan) para que el cliente no pueda falsificar su IP
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    # SPA — devolver index.html para cualquier ruta desconocida
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache";
    }

    # Cache largo para assets con hash
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Nunca servir archivos ocultos (.env, .git…)
    location ~ /\. { deny all; return 404; }
}
