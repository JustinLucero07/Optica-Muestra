services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-optica}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en deploy/.env}
      POSTGRES_DB: ${DB_NAME:-optica}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sin "ports": la base no es accesible desde la red, solo desde el backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-optica} -d ${DB_NAME:-optica}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Respaldo automático de la base de datos: uno al arrancar y luego cada 24 h,
  # en la carpeta deploy/respaldos (cópiala a un USB o a la nube de vez en cuando).
  # Se guardan los últimos RESPALDO_DIAS días (30 por defecto).
  respaldos:
    image: postgres:16-alpine
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-optica}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-optica}
      DIAS: ${RESPALDO_DIAS:-30}
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      - ./respaldos:/respaldos
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/respaldos/optica_$$(date +%Y-%m-%d_%H%M).sql.gz
          if pg_dump --no-owner | gzip > "$$f.part"; then mv "$$f.part" "$$f"; echo "Respaldo OK: $$f"
          else echo "ERROR: no se pudo crear el respaldo"; fi
          find /respaldos -name 'optica_*.sql.gz' -mtime +$$DIAS -delete
          sleep 86400
        done

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en deploy/.env}

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-optica}:${DB_PASSWORD}@db:5432/${DB_NAME:-optica}
      # Sin JWT_SECRET el backend no arranca (evita usar una clave vacía o la de ejemplo)
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en deploy/.env}
      ENV: production
      # El navegador habla con nginx (mismo origen): no hace falta CORS
      BACKEND_CORS_ORIGINS: '[]'
      # Intentos fallidos de login compartidos entre los workers
      REDIS_URL: redis://:${REDIS_PASSWORD:?Falta REDIS_PASSWORD en deploy/.env}@redis:6379/0
      TZ: ${TZ:-America/Guayaquil}
      WA_TOKEN: ${WA_TOKEN:-}
      WA_PHONE_ID: ${WA_PHONE_ID:-}
      WA_BIRTHDAY_TEMPLATE: ${WA_BIRTHDAY_TEMPLATE:-}
      WA_BIRTHDAY_LANG: ${WA_BIRTHDAY_LANG:-es}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
